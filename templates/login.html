<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 이메일 할일관리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="modal auth-container">
      <h1 style="text-align:center;">📬 이메일 할일관리</h1>
      <h2 class="auth-title">로그인</h2>

      {% if error %}
      <p class="auth-error">{{ error }}</p>
      {% endif %}

      <form class="auth-form" action="{{ url_for('login') }}" method="post">
        <input type="text" name="username" placeholder="아이디" autocomplete="username" required>
        <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary">로그인</button>
      </form>

      <p class="auth-switch">계정이 없으신가요? <a href="{{ url_for('signup') }}">회원가입</a></p>
    </div>
  </div>
</body>
</html>
